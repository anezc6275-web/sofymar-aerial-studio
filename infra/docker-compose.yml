# Servicios locales para la Etapa 1 (no necesarios para probar la Estación de Dirección).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sofymar
      POSTGRES_PASSWORD: sofymar_local
      POSTGRES_DB: sofymar
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sofymar
      MINIO_ROOT_PASSWORD: sofymar_local
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
